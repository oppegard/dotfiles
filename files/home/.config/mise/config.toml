min_version = "2026.9.17"


[settings]
auto_update                         = true
dotfiles.default_mode               = "symlink"
dotfiles.root                       = "~/.dotfiles"
experimental                        = true
history.describe_command            = 'bash "$HOME/.dotfiles/bin/mise-history-describe"'
idiomatic_version_file_enable_tools = ["node", "ruby"]


[settings.ruby]
compile = false


[bootstrap.hooks]
post-packages = 'bash "$HOME/.dotfiles/bin/hooks/post-packages-hook.sh"'


[bootstrap.services.mise-history]
builtin = "history-watch"


[history]
git_email = "mise@{hostname}"


[dotfiles]
"~/.claude/CLAUDE.md"           = {
  source = "~/.dotfiles/files/home/.codex/AGENTS.md",
  mode   = "symlink"
}
"~/.claude/CODING_STANDARDS.md" = "~/.dotfiles/files/home/.codex/CODING_STANDARDS.md"

"~/.config/mise/config.home.toml"  = "~/.dotfiles/files/home/.config/mise/config.home.toml"
"~/.config/mise/config.linux.toml" = "~/.dotfiles/files/home/.config/mise/config.linux.toml"
"~/.config/mise/config.macos.toml" = "~/.dotfiles/files/home/.config/mise/config.macos.toml"
"~/.config/mise/config.toml"       = "~/.dotfiles/files/home/.config/mise/config.toml"
"~/.config/mise/miserc.toml"       = {
  source = "~/.dotfiles/files/home/.config/mise/miserc.toml.tera",
  mode   = "template"
}

"~/.config/mise/conf.d/macos-menubar-spacing.toml" = {
  source = "~/.dotfiles/files/home/.config/mise/conf.d/macos-menubar-spacing.toml.tera",
  mode   = "template"
}

"~/.config/btop"          = "~/.dotfiles/files/home/.config/btop"
"~/.config/curlrc"        = "~/.dotfiles/files/home/.config/curlrc"
"~/.config/ghostty"       = "~/.dotfiles/files/home/.config/ghostty"
"~/.config/git"           = {
  source   = "~/.dotfiles/files/home/.config/git",
  mode     = "symlink-each",
  manifest = "git"
}
"~/.config/ripgreprc"     = "~/.dotfiles/files/home/.config/ripgreprc"
"~/.config/shell"         = {
  source = "~/.dotfiles/files/home/.config/shell",
  mode   = "symlink-each"
}
"~/.config/starship.toml" = "~/.dotfiles/files/home/.config/starship.toml"
"~/.config/tmux"          = "~/.dotfiles/files/home/.config/tmux"
"~/.config/uv"            = "~/.dotfiles/files/home/.config/uv"

"~/.codex/.ignore"             = "~/.dotfiles/files/home/.codex/.ignore"
"~/.codex/AGENTS.md"           = "~/.dotfiles/files/home/.codex/AGENTS.md"
"~/.codex/CODING_STANDARDS.md" = "~/.dotfiles/files/home/.codex/CODING_STANDARDS.md"

"~/.bash_profile" = "~/.dotfiles/files/home/.bash_profile"
"~/.bashrc"       = "~/.dotfiles/files/home/.bashrc"
"~/.bunfig.toml"  = "~/.dotfiles/files/home/.bunfig.toml"
"~/.digrc"        = "~/.dotfiles/files/home/.digrc"
"~/.gitconfig"    = "~/.dotfiles/files/home/.gitconfig"
"~/.inputrc"      = "~/.dotfiles/files/home/.inputrc"
"~/.npmrc"        = "~/.dotfiles/files/home/.npmrc"
"~/.screenrc"     = "~/.dotfiles/files/home/.screenrc"
"~/.ssh/config"   = "~/.dotfiles/files/home/.ssh/config"

"~/.local/bin" = {
  source  = "~/.dotfiles/files/home/.local/bin",
  mode    = "symlink-each",
  exclude = [
    "fix-tahoe-focus",
    "flush-dns",
    "mise-history",
    "restart-soundsource",
    "screen-5.0.1",
    "try-darwin-aarch64",
    "try-linux-x86_64",
  ]
}

# Tracked configs
"~/.aws/config"           = {
  mode     = "track",
  variants = [{ profile = "work" }]
}
"~/.claude/settings.json" = {
  mode     = "track",
  variants = [{ profile = "work" }]
}

"~/.codex/config.toml"         = {
  mode     = "track",
  variants = [
    { profile = "home" },
    { profile = "work" },
  ]
}
"~/.codex/rules/default.rules" = {
  mode     = "track",
  variants = [
    { profile = "home" },
    { profile = "work" },
  ]
}


[tools]
actionlint = "1"
age        = "1"
bun        = "1"
gh         = {
  version     = "2",
  postinstall = '"$HOME/.dotfiles/bin/check-gh-credential-helper"'
}
git-lfs    = "3.8.0"
go         = "1.27"
gum        = "2"
hk         = { version = "2.0.1", postinstall = "hk install --global --mise" }
lazydocker = "latest"
lazygit    = "latest"
node       = "lts"
ripgrep    = "latest"
ruby       = "4"
shellcheck = "latest"

"aqua:hashicorp/terraform"      = "1.16"
"aqua:terraform-linters/tflint" = "latest"
"npm:@mermaid-js/mermaid-cli"   = {
  version     = "11",
  postinstall = '''env -u PUPPETEER_CACHE_DIR node "$(find "$MISE_TOOL_INSTALL_PATH/node_modules" -path '*/puppeteer/install.mjs' -print -quit)"'''
}
