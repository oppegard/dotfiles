name: Integration Tests

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  integration-test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-26.04
    env:
      DOTFILES_INTEGRATION_DISPOSABLE: "1"
      GITHUB_TOKEN: ${{ github.token }}
      MISE_ENV: home

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.27.x
          cache: false

      - name: Exclude Cask and MAS packages in CI
        if: runner.os == 'macOS'
        run: echo 'MISE_SYSTEM_PACKAGES_MANAGERS=brew' >> "$GITHUB_ENV"

      - name: Share mise cache with the bootstrap test
        run: |
          echo "MISE_DATA_DIR=$HOME/.local/share/mise" >> "$GITHUB_ENV"
          echo "MISE_CACHE_DIR=$HOME/.cache/mise" >> "$GITHUB_ENV"

      - name: Set up and cache mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true
          cache_key: "integration-v1-{{platform}}-{{file_hash}}-${{ hashFiles('files/home/.config/mise/**/*.toml*') }}"

      - name: Run integration tests
        run: mise run test:integration
