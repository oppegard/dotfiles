name: Lint

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
      MISE_GLOBAL_CONFIG_ROOT: ${{ github.workspace }}
      MISE_TASK_RUN_AUTO_INSTALL: "0"
      MISE_EXEC_AUTO_INSTALL: "0"
      NO_COLOR: "1"
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: true
          install: false

      - name: Install gitleaks
        run: mise use -g "gitleaks@$(awk -F '\"' '/^gitleaks = / { print $2 }' mise/config.toml)"

      - name: Run lint
        run: mise run lint
