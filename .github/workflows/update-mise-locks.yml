name: Update mise locks

on:
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:
    inputs:
      emergency_tool:
        description: Tool name that bypasses the 7 day age window
        required: false
        type: string

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: update-mise-locks
  cancel-in-progress: false

jobs:
  update:
    name: Update mise locks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # Push the lock update branch.
      pull-requests: write # Create or update its pull request.
      actions: write # Dispatch CI against the update branch.
    env:
      PR_BRANCH: automation/mise-locks
      MISE_LOCKS_HAS_APP: ${{ secrets.MISE_LOCKS_APP_ID != '' && secrets.MISE_LOCKS_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Check out default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up mise without installing tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false

      - name: Create GitHub App token
        id: app-token
        if: ${{ env.MISE_LOCKS_HAS_APP == 'true' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          # jactionlint ignore=deprecated-action-input
          app-id: ${{ secrets.MISE_LOCKS_APP_ID }}
          private-key: ${{ secrets.MISE_LOCKS_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Update project and global locks
        env:
          MISE_LOCK_EMERGENCY_TOOL: ${{ github.event_name == 'workflow_dispatch' && inputs.emergency_tool || '' }}
          MISE_LOCK_PR_TITLE_FILE: ${{ runner.temp }}/mise-lock-title.txt
          MISE_LOCK_PR_BODY_FILE: ${{ runner.temp }}/mise-lock-body.md
        run: |
          set -euo pipefail
          bash .github/scripts/update-mise-locks.sh
          # git add must receive existing paths even when no tool needs sidecars.
          mkdir -p .mise/locks files/home/.config/mise/locks

      - name: Read generated pull request title
        id: pr-text
        run: |
          set -euo pipefail
          {
            echo "title<<EOF"
            cat "$RUNNER_TEMP/mise-lock-title.txt"
            echo "EOF"
          } >>"$GITHUB_OUTPUT"

      - name: Create or update lock pull request
        id: pull-request
        # jactionlint ignore=superfluous-actions
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          branch: ${{ env.PR_BRANCH }}
          base: ${{ github.event.repository.default_branch }}
          commit-message: ${{ steps.pr-text.outputs.title }}
          title: ${{ steps.pr-text.outputs.title }}
          body-path: ${{ runner.temp }}/mise-lock-body.md
          add-paths: |
            mise.lock
            .mise/locks/
            files/home/.config/mise/mise.lock
            files/home/.config/mise/locks/

      - name: Run CI on the active pull request head
        if: ${{ env.MISE_LOCKS_HAS_APP != 'true' && steps.pull-request.outputs.pull-request-number != '' && steps.pull-request.outputs.pull-request-head-sha != '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ steps.pull-request.outputs.pull-request-head-sha }}
        run: |
          set -euo pipefail
          branch_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$PR_BRANCH" --jq '.object.sha')
          if [[ "$branch_sha" != "$PR_HEAD_SHA" ]]; then
            echo "::error::Update branch no longer matches pull request head $PR_HEAD_SHA"
            exit 1
          fi
          gh workflow run lint.yml --repo "$GITHUB_REPOSITORY" --ref "$PR_BRANCH"
          gh workflow run integration-tests.yml --repo "$GITHUB_REPOSITORY" --ref "$PR_BRANCH"

      - name: Enable auto-merge
        if: ${{ vars.MISE_LOCKS_AUTOMERGE == 'true' && steps.pull-request.outputs.pull-request-number != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          PR_NUMBER: ${{ steps.pull-request.outputs.pull-request-number }}
        run: |
          set -euo pipefail
          gh pr merge --auto "$PR_NUMBER"
