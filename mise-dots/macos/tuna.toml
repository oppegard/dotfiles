[settings]
comboModeCheatsheetDelayMS = 500
comboModeCheatsheetExpandGroups = true
comboModeCheatsheetShowDetails = false
comboModeDoublePressTrigger = 'rightCommand'
comboModeModifierTrigger = 'rightCommand'
comboModeTriggerType = 'modifier'

[[smartLinks.entries]]
enabled = true
name = 'Bing'
requiresInput = true
template = 'https://www.bing.com/search?q={{input}}'

