min_version = "2026.10.17"


[settings]
idiomatic_version_file_enable_tools = ["go"]
lockfile = true
lockfile_platforms = ["linux-x64", "macos-arm64"]
minimum_release_age = "7d"


[tools]
gitleaks = "8.30.1"
hk = { version = "latest", postinstall = "hk install --mise" }
jactionlint = "2"
rumdl = "latest"
ruby = "4"
shellcheck = "latest"
shfmt = "latest"
tombi = "latest"
yamlfmt = "latest"


[env]
_.path = ["./bin"]


[tasks.lint]
description = "Run all lint checks"
run = "hk check --all"


[tasks.lint-fix]
description = "Automatically fix all lint issues"
run = "hk fix --all"


[tasks."test:integration"]
description = "Run Go integration tests; bootstrap needs a disposable machine"
run = "go test -v -count=1 -timeout=20m ./test/integration"
