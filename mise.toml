[tools]
gitleaks   = "8.30.1"
hk         = { version = "2.0.1", postinstall = "hk install --mise" }
shellcheck = "latest"
shfmt      = "latest"
tombi      = "latest"
yamlfmt    = "latest"


[env]
_.path = ["./bin"]


[tasks.lint]
description = "Run all lint checks"
run         = "hk check --all"


[tasks.lint-fix]
description = "Automatically fix all lint issues"
run         = "hk fix --all"


[tasks."test:integration"]
description = "Run Go integration tests; bootstrap needs a disposable machine"
run         = "cd test/integration && go test -v -count=1 -timeout=20m ./..."
