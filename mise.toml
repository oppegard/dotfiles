[tools]
gitleaks = "8.30.1"
hk = { version = "2.0.1", postinstall = "hk install --mise" }
taplo = "latest"

[env]
_.path = ["./bin"]
HK_MISE = 1

[tasks."lint:secrets"]
description = "Scan the working tree for hardcoded secrets"
run = "gitleaks dir --redact=85 --no-banner --no-color --max-target-megabytes 5 --config .gitleaks.toml ."

[tasks.lint]
description = "Run all lint checks"
depends = ['lint:*']
