# rumdl configuration for the hk rumdl builtin.
#
# MD013 (line length) is off. Plan and research notes use long sentences, and
# reflow would rewrite them.
#
# Remaining per-file ignores are ones rumdl cannot fix, or should not rewrite:
# MD025 on files/home/.codex/AGENTS.md (generated pstack heading) and MD057 on
# the listed plan and research notes (links to paths outside this repository).
# Skill files satisfy MD041 through front-matter-title-pattern below.

[global]
cache = false
disable = ["MD013"]
exclude = ["vendor/**"]
# GitHub-flavored markdown. rumdl accepts "gfm" as that flavor.
flavor = "gfm"


[MD041]
front-matter-title-pattern = "^(name|title):"


[per-file-ignores]
"docs/plans/20260929-pre-commit-secret-e2e.md" = ["MD057"]
"docs/plans/20261001-git-tab-completion-regression.md" = ["MD057"]
"docs/research/20260917-macos-27-menu-bar-order-automation.md" = ["MD057"]
"files/home/.codex/AGENTS.md" = ["MD025"]
