#:schema https://www.schemastore.org/gitleaks.json
# Credit: https://github.com/nateberkopec/dotfiles/blob/main/files/home/.claude/skills/dev-env-setup/scripts/check-dev-env/gitleaks-default.toml
# Extends gitleaks' default rules and allowlists common vendored/build
# directories that ship with dependencies and are typically gitignored.

title = "glenno gitleaks config"


[extend]
useDefault = true


[[allowlists]]
description = "vendored or generated directories that aren't part of the project's source"
paths       = [
  '''(^|/)\.bundle/(ruby|cache|gems|extensions|plugin|plugins|vendor)/''',
  '''(^|/)\.cargo/''',
  '''(^|/)\.gem/''',
  '''(^|/)\.next/''',
  '''(^|/)\.nuxt/''',
  '''(^|/)\.pi-subagents/''',
  '''(^|/)\.pnpm-store/''',
  '''(^|/)\.venv/''',
  '''(^|/)\.yarn/''',
  '''(^|/)__pycache__/''',
  '''(^|/)build/''',
  '''(^|/)dist/''',
  '''(^|/)node_modules/''',
  '''(^|/)target/''',
  '''(^|/)vendor/bundle/''',
  '''(^|/)vendor/cache/''',
]


[[allowlists]]
condition   = "AND"
description = "Git GPG signing key fingerprints"
paths       = ['''(^|/)\.gitconfig$''', '''(^|/)files/home/\.gitconfig$''']
regexes     = ['''signingkey\s*=\s*[A-F0-9]{40}''']
