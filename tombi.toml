# Format and validate mise configuration files with mise's maintained schema.
toml-version = "v1.1.0"

[[schemas]]
path = "https://mise.jdx.dev/schema/mise.json"
include = [
  "mise.toml",
  ".mise.toml",
  "mise.*.toml",
  ".mise.*.toml",
  "**/.mise/**/*.toml",
  "**/mise/**/*.toml",
]

[[schemas.overrides]]
targets = [
  "bootstrap.macos.defaults",
  "bootstrap.macos.defaults.*",
]

[schemas.overrides.format.rules]
table-keys-order = "ascending"
