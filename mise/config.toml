[settings]
auto_update = true
dotfiles.root = "~/.dotfiles"
dotfiles.default_mode = "symlink"
experimental = true
history.describe_command = '''
codex exec --sandbox read-only --ephemeral --color never \
 --skip-git-repo-check --ignore-user-config \
 --model gpt-5.6-luna --config 'model_reasoning_effort="none"' \
 'Describe this change to my configuration files in one line of at most 120 characters, plain text, no quotes.'
'''
idiomatic_version_file_enable_tools = ["node", "ruby"]

[settings.ruby]
compile = false

[bootstrap.hooks]
post-packages = 'bash "$HOME/.dotfiles/bin/hooks/post-packages-hook.sh"'

[bootstrap.services.mise-history]
builtin = "history-watch"

[dotfiles]
"~/.aws/config" = { mode = "track", variants = [{ profile = "work" }] }
"~/.bash_profile" = "~/.dotfiles/files/home/.bash_profile"
"~/.bashrc" = "~/.dotfiles/files/home/.bashrc"
"~/.bunfig.toml" = "~/.dotfiles/files/home/.bunfig.toml"
"~/.claude/settings.json" = { mode = "track", variants = [
  { profile = "work" },
] }
"~/.codex/.ignore" = "~/.dotfiles/files/home/.codex/.ignore"
"~/.codex/AGENTS.md" = "~/.dotfiles/files/home/.codex/AGENTS.md"
"~/.codex/config.toml" = { mode = "track", variants = [
  { profile = "work" },
  { profile = "home" },
] }
"~/.codex/rules/default.rules" = { mode = "track", variants = [
  { profile = "work" },
  { profile = "home" },
] }
"~/.config/btop" = "~/.dotfiles/files/home/.config/btop"
"~/.config/curlrc" = "~/.dotfiles/files/home/.config/curlrc"
"~/.config/ghostty" = "~/.dotfiles/files/home/.config/ghostty"
"~/.config/git" = { source = "~/.dotfiles/files/home/.config/git", mode = "symlink-each", manifest = "git" }
"~/.config/mise/conf.d/macos-menubar-spacing.toml" = { source = "~/.dotfiles/mise/macos-menubar-spacing.toml.tera", mode = "template" }
"~/.config/mise/config.home.toml" = "~/.dotfiles/mise/config.home.toml"
"~/.config/mise/config.linux.toml" = "~/.dotfiles/mise/config.linux.toml"
"~/.config/mise/config.macos.toml" = "~/.dotfiles/mise/config.macos.toml"
"~/.config/mise/config.toml" = "~/.dotfiles/mise/config.toml"
"~/.config/mise/miserc.toml" = { source = "~/.dotfiles/mise/miserc.toml.tera", mode = "template" }
"~/.config/ripgreprc" = "~/.dotfiles/files/home/.config/ripgreprc"
"~/.config/shell" = { source = "~/.dotfiles/files/home/.config/shell", mode = "symlink-each" }
"~/.config/starship.toml" = "~/.dotfiles/files/home/.config/starship.toml"
"~/.config/tmux" = "~/.dotfiles/files/home/.config/tmux"
"~/.config/uv" = "~/.dotfiles/files/home/.config/uv"
"~/.digrc" = "~/.dotfiles/files/home/.digrc"
"~/.gitconfig" = "~/.dotfiles/files/home/.gitconfig"
"~/.inputrc" = "~/.dotfiles/files/home/.inputrc"
"~/.local/bin" = { source = "~/.dotfiles/files/home/.local/bin", mode = "symlink-each", exclude = [
  "fix-tahoe-focus",
  "flush-dns",
  "restart-soundsource",
  "screen-5.0.1",
  "try-darwin-aarch64",
  "try-linux-x86_64",
] }
"~/.npmrc" = "~/.dotfiles/files/home/.npmrc"
"~/.screenrc" = "~/.dotfiles/files/home/.screenrc"
"~/.ssh/config" = "~/.dotfiles/files/home/.ssh/config"
"~/src/drafthouse/mise.toml" = { mode = "track", variants = [
  { profile = "work" },
] }

[tools]
"aqua:hashicorp/terraform" = "1.16"
"aqua:terraform-linters/tflint" = "latest"
actionlint = "1"
age = "1"
bun = "1"
git-lfs = "3.8.0"
gitleaks = "8.30.1"
gh = { version = "2", postinstall = '"$HOME/.dotfiles/bin/check-gh-credential-helper"' }
go = "1.26"
gum = "2"
hk = { version = "2.0.1", postinstall = "hk install --global --mise" }
lazydocker = "latest"
lazygit = "latest"
node = "24"
ripgrep = "latest"
ruby = "4"
shellcheck = "latest"
