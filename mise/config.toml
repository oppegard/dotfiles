[settings]
auto_update = true
dotfiles.root = "~/.dotfiles"
dotfiles.default_mode = "symlink"
experimental = true
history.describe_command = '''
codex exec --sandbox read-only --ephemeral --color never \
 --skip-git-repo-check --ignore-user-config \
 --model gpt-5.6-luna --config 'model_reasoning_effort="none"' \
 'Describe this change to my configuration files in one line of at most 120 characters, plain text, no quotes.'
'''
idiomatic_version_file_enable_tools = ["node", "ruby"]

[settings.ruby]
compile = false

[bootstrap.services.mise-history]
builtin = "history-watch"

[dotfiles]
"~/.aws/config" = { mode = "track", variants = [{ profile = "work" }] }
"~/.bash_profile" = "~/.dotfiles/mise-dots/bash_profile"
"~/.bashrc" = "~/.dotfiles/mise-dots/bashrc"
"~/.bunfig.toml" = "~/.dotfiles/mise-dots/bunfig.toml"
"~/.claude/settings.json" = { mode = "track", variants = [
  { profile = "work" },
] }
"~/.codex/.ignore" = "~/.dotfiles/mise-dots/codex/.ignore"
"~/.codex/AGENTS.md" = "~/.dotfiles/mise-dots/codex/AGENTS.md"
"~/.codex/config.toml" = { mode = "track", variants = [
  { profile = "work" },
  { profile = "home" },
] }
"~/.codex/rules/default.rules" = { mode = "track", variants = [
  { profile = "work" },
  { profile = "home" },
] }
"~/.config/btop" = "~/.dotfiles/mise-dots/config/btop"
"~/.config/curlrc" = "~/.dotfiles/mise-dots/config/curlrc"
"~/.config/ghostty" = "~/.dotfiles/mise-dots/config/ghostty"
"~/.config/git" = { source = "~/.dotfiles/mise-dots/config/git", mode = "symlink-each", manifest = "git" }
"~/.config/mise/conf.d/macos-menubar-spacing.toml" = { source = "~/src/dotfiles/mise/macos-menubar-spacing.toml.tera", mode = "template" }
"~/.config/mise/config.home.toml" = "~/src/dotfiles/mise/config.home.toml"
"~/.config/mise/config.linux.toml" = "~/src/dotfiles/mise/config.linux.toml"
"~/.config/mise/config.macos.toml" = "~/src/dotfiles/mise/config.macos.toml"
"~/.config/mise/config.toml" = "~/src/dotfiles/mise/config.toml"
"~/.config/mise/miserc.toml" = { source = "~/src/dotfiles/mise/miserc.toml.tera", mode = "template" }
"~/.config/ripgreprc" = "~/.dotfiles/mise-dots/config/ripgreprc"
"~/.config/shell" = { source = "~/.dotfiles/mise-dots/config/shell", mode = "symlink-each" }
"~/.config/starship.toml" = "~/.dotfiles/mise-dots/config/starship.toml"
"~/.config/tmux" = "~/.dotfiles/mise-dots/config/tmux"
"~/.config/uv" = "~/.dotfiles/mise-dots/config/uv"
"~/.digrc" = "~/.dotfiles/mise-dots/digrc"
"~/.dotfiles" = "~/src/dotfiles"
"~/.gitconfig" = "~/.dotfiles/mise-dots/gitconfig"
"~/.inputrc" = "~/.dotfiles/mise-dots/inputrc"
"~/.local/bin" = { source = "~/.dotfiles/mise-dots/xdg-bin", mode = "symlink-each" }
"~/.npmrc" = "~/.dotfiles/mise-dots/npmrc"
"~/.screenrc" = "~/.dotfiles/mise-dots/screenrc"
"~/.ssh/config" = "~/.dotfiles/mise-dots/ssh/config"
"~/src/drafthouse/mise.toml" = { mode = "track", variants = [
  { profile = "work" },
] }

[tools]
"aqua:hashicorp/terraform" = "1.16"
"aqua:terraform-linters/tflint" = "latest"
actionlint = "1"
age = "1"
bun = "1"
gh = "2"
go = "1.26"
gum = "2"
lazydocker = "latest"
lazygit = "latest"
node = "24"
ripgrep = "latest"
ruby = "4"
shellcheck = "latest"
tombi = "1"
