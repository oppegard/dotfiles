[dotfiles]
"~/.config/borders/bordersrc" = "~/.dotfiles/mise-dots/macos/bordersrc"
"~/.config/linearmouse/linearmouse.json" = "~/.dotfiles/mise-dots/macos/linearmouse.json"
"~/.homebrew/Brewfile" = "~/.dotfiles/Brewfile"
"~/.local/bin/fix-tahoe-focus" = "~/.dotfiles/mise-dots/macos/xdg-bin/fix-tahoe-focus"
"~/.local/bin/flush-dns" = "~/.dotfiles/mise-dots/macos/xdg-bin/flush-dns"
"~/.local/bin/restart-soundsource" = "~/.dotfiles/mise-dots/macos/xdg-bin/restart-soundsource"
"~/.local/bin/try" = "~/.dotfiles/mise-dots/macos/xdg-bin/try-darwin-aarch64"
"~/Library/Application Support/Sublime Text 3/Packages/User" = "~/.dotfiles/mise-dots/config/sublime-text/Packages/User"
"~/Library/Application Support/Rectangle Pro/RectangleProConfig.json" = { source = "~/.dotfiles/mise-dots/macos/RectangleProConfig.json", mode = "copy" }
"~/Library/Application Support/Tuna/config.toml" = "~/.dotfiles/mise-dots/macos/tuna.toml"

[tasks."macos-defaults:record"]
description = "Record one interactive macOS defaults change"
shell = "bash -c"
run = 'cd "{{ env.HOME }}/.dotfiles/vendor/macos-defaults" && bash ./diff.sh'

[tasks."macos-defaults:status"]
description = "Show managed macOS defaults drift; fail when reconciliation is needed"
shell = "bash -c"
run = 'mise -C "{{ env.HOME }}/.dotfiles/mise" bootstrap macos defaults status --missing'

[tasks."macos-defaults:unsupported:check"]
description = "Verify reviewed host-scoped and complex macOS defaults"
shell = "bash -c"
run = '"{{ env.HOME }}/.dotfiles/bin/macos-defaults-audit" verify --manifest "{{ env.HOME }}/.dotfiles/mise-dots/macos/unsupported-defaults.json"'

[tasks."betterdisplay:check"]
description = "Check BetterDisplay sync profile against dotfiles"
shell = "bash -c"
run = '"{{ env.HOME }}/.dotfiles/bin/betterdisplay-prefs" check'

[tasks."betterdisplay:export"]
description = "Export BetterDisplay sync profile to dotfiles"
shell = "bash -c"
run = '"{{ env.HOME }}/.dotfiles/bin/betterdisplay-prefs" export'

[tasks."betterdisplay:import"]
description = "Import BetterDisplay sync profile from dotfiles"
confirm = { message = "Apply the dotfiles BetterDisplay sync profile?", default = "no" }
shell = "bash -c"
run = '"{{ env.HOME }}/.dotfiles/bin/betterdisplay-prefs" import'

[bootstrap.user]
login_shell = "/opt/homebrew/bin/bash"

# Apple's local sudo PAM override is included by /etc/pam.d/sudo and survives
# macOS updates. This lets sudo offer Touch ID in Terminal.app, Ghostty, and
# iTerm2 while retaining Apple's normal password fallback.
[bootstrap.files."/etc/pam.d/sudo_local"]
content = """
# sudo_local: local config file which survives system update and is included for sudo
auth       sufficient     pam_tid.so
"""
owner = "root"
group = "wheel"
mode = "0444"

[bootstrap.macos.trackpad]
tap_to_click = true

[bootstrap.macos.defaults]
"NSGlobalDomain" = {
AppleShowScrollBars = "Always",
AppleKeyboardUIMode = 2, # Enable keyboard navigation with Tab and Shift-Tab.
NSAutomaticCapitalizationEnabled = false, # Do not capitalize words automatically.
NSAutomaticDashSubstitutionEnabled = false, # Do not replace double hyphens with smart dashes automatically.
NSAutomaticQuoteSubstitutionEnabled = false, # Do not replace straight quotes with smart quotes automatically.
NSAutomaticSpellingCorrectionEnabled = false, # Do not correct spelling automatically.
NSStatusItemSelectionPadding = 12, # Menu bar item padding; default is 16 or use `defaults delete`.
NSStatusItemSpacing = 12, # Menu bar item spacing; default is 16 or use `defaults delete`.
}

"com.apple.Music" = {
userWantsPlaybackNotifications = false, # Do not show a notification when a new song starts.
}

"com.apple.dock" = {
appswitcher-all-displays = true, # Switch to the Space containing an application's open windows when switching apps.
orientation = "left",
show-process-indicators = true, # Show an indicator below each open application in the Dock.
show-recents = false,
wvous-bl-corner = 5, # Start the screen saver from the bottom-left Hot Corner.
wvous-bl-modifier = 0, # Do not require a modifier key for the bottom-left Hot Corner.
wvous-br-corner = 1, # Disable the bottom-right Hot Corner.
wvous-br-modifier = 0, # Do not require a modifier key for the bottom-right Hot Corner.
}

"com.apple.finder" = {
FXPreferredViewStyle = "Nlsv", # Use List view for folders without a custom view.
NewWindowTarget = "PfHm", # Open new Finder windows to the Home folder.
ShowRecentTags = false, # Hide Recent Tags in the Finder sidebar.
_FXSortFoldersFirst = true, # Keep folders on top when sorting by name.
}

"com.apple.screencapture" = { # `killall SystemUIServer`
location = "~/Downloads/Screenshots",
}

"com.apple.Safari" = { # `killall Safari`
ShowFullURLInSmartSearchField = true, # Show the full website address.
}

"com.apple.menuextra.clock" = { # `killall SystemUIServer`
ShowDate = 2, # Do not show the date in the menu bar clock.
ShowDayOfWeek = false, # Do not show the day of the week in the menu bar clock.
}

"com.apple.WindowManager" = {
EnableStandardClickToShowDesktop = false, # Do not move windows aside when clicking the desktop wallpaper.
EnableTiledWindowMargins = false, # Do not leave margins around tiled windows.
EnableTilingByEdgeDrag = false, # Do not tile a window by dragging it to a screen edge.
EnableTilingOptionAccelerator = false, # Do not use Option-drag to tile a window.
EnableTopTilingByEdgeDrag = false, # Do not tile or fill a window by dragging it to the menu bar.
}

"com.apple.universalaccess" = {
reduceTransparency = true, # Replace transparent macOS backgrounds with solid backgrounds.
showToolbarButtonShapes = true, # Show a subtle border around toolbar buttons to indicate their click target.
showWindowTitlebarIcons = true, # Show the folder icon before the Finder window title. Relaunch Finder: killall Finder.
}

"com.apple.AppleMultitouchTrackpad" = {
ActuateDetents = 0, # Keep the accompanying haptic-detent state disabled.
ForceSuppressed = true, # Disable Force Click and haptic feedback.
TrackpadFiveFingerPinchGesture = 0, # Disable the five-finger pinch gesture.
TrackpadFourFingerPinchGesture = 0, # Disable the four-finger pinch gesture.
TrackpadFourFingerVertSwipeGesture = 0, # Disable the four-finger vertical swipe gesture.
TrackpadThreeFingerVertSwipeGesture = 0, # Disable the three-finger vertical swipe gesture.
TrackpadTwoFingerFromRightEdgeSwipeGesture = 0,   # Disable the two-finger swipe from the right edge.
}

"com.apple.driver.AppleBluetoothMultitouch.trackpad" = {
TrackpadFiveFingerPinchGesture = 0, # Disable the five-finger pinch gesture on an Apple Bluetooth trackpad.
TrackpadFourFingerPinchGesture = 0, # Disable the four-finger pinch gesture on an Apple Bluetooth trackpad.
TrackpadFourFingerVertSwipeGesture = 0, # Disable the four-finger vertical swipe gesture on an Apple Bluetooth trackpad.\
TrackpadThreeFingerVertSwipeGesture = 0, # Disable the three-finger vertical swipe gesture on an Apple Bluetooth trackpad.
TrackpadTwoFingerFromRightEdgeSwipeGesture = 0, # Disable the two-finger swipe from the right edge on an Apple Bluetooth trackpad.
}
