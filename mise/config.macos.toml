[bootstrap.user]
login_shell = "/opt/homebrew/bin/bash"

[bootstrap.macos.trackpad]
# Source: https://support.apple.com/en-au/guide/mac-help/mchlp1226/mac
# Tap the trackpad with one finger to click.
tap_to_click = true

# macOS defaults (https://macos-defaults.com)
[bootstrap.macos.defaults."NSGlobalDomain"]
# Enable keyboard navigation with Tab and Shift-Tab.
"AppleKeyboardUIMode" = 2
# Always show scroll bars.
"AppleShowScrollBars" = "Always"
# Do not capitalize words automatically.
"NSAutomaticCapitalizationEnabled" = false
# Do not replace double hyphens with smart dashes automatically.
"NSAutomaticDashSubstitutionEnabled" = false
# Do not replace straight quotes with smart quotes automatically.
"NSAutomaticQuoteSubstitutionEnabled" = false
# Do not correct spelling automatically.
"NSAutomaticSpellingCorrectionEnabled" = false

[bootstrap.macos.defaults."com.apple.Music"]
# https://macos-defaults.com/misc/userwantsplaybacknotifications.html
# Do not show a notification when a new song starts.
# `killall Music`
"userWantsPlaybackNotifications" = false

[bootstrap.macos.defaults."com.apple.dock"]
# Source: https://macos-defaults.com/dock/
# Relaunch Dock after applying: killall Dock.
"orientation" = "left"
"show-recents" = false
# Show an indicator below each open application in the Dock.
"show-process-indicators" = true
# Switch to the Space containing an application's open windows when switching apps.
"appswitcher-all-displays" = true
# Start the screen saver from the bottom-left Hot Corner.
"wvous-bl-corner" = 5
# Do not require a modifier key for the bottom-left Hot Corner.
"wvous-bl-modifier" = 0
# Disable the bottom-right Hot Corner.
"wvous-br-corner" = 1
# Do not require a modifier key for the bottom-right Hot Corner.
"wvous-br-modifier" = 0

[bootstrap.macos.defaults."com.apple.finder"]
# https://macos-defaults.com/finder/
# `killall Finder`
# Use List view for folders without a custom view. 
"FXPreferredViewStyle" = "Nlsv"
# Keep folders on top when sorting by name.
"_FXSortFoldersFirst" = true

[bootstrap.macos.defaults."com.apple.screencapture"]
# https://macos-defaults.com/screenshots/
# `killall SystemUIServer`
"location" = "~/Downloads/Screenshots"

[bootstrap.macos.defaults."com.apple.Safari"]
# https://macos-defaults.com/safari/showfullurlinsmartsearchfield.html
# Show the full website address. Relaunch Safari: killall Safari.
"ShowFullURLInSmartSearchField" = true

[bootstrap.macos.defaults."com.apple.universalaccess"]
# Replace transparent macOS backgrounds with solid backgrounds.
"reduceTransparency" = true
# Show a subtle border around toolbar buttons to indicate their click target.
"showToolbarButtonShapes" = true
# Show the folder icon before the Finder window title. Relaunch Finder: killall Finder.
"showWindowTitlebarIcons" = true

[bootstrap.macos.defaults."com.apple.AppleMultitouchTrackpad"]
# Disable Force Click and haptic feedback.
"ForceSuppressed" = true
# Keep the accompanying haptic-detent state disabled.
"ActuateDetents" = 0
# Disable the five-finger pinch gesture.
"TrackpadFiveFingerPinchGesture" = 0
# Disable the four-finger pinch gesture.
"TrackpadFourFingerPinchGesture" = 0
# Disable the four-finger vertical swipe gesture.
"TrackpadFourFingerVertSwipeGesture" = 0
# Disable the three-finger vertical swipe gesture.
"TrackpadThreeFingerVertSwipeGesture" = 0
# Disable the two-finger swipe from the right edge.
"TrackpadTwoFingerFromRightEdgeSwipeGesture" = 0

[bootstrap.macos.defaults."com.apple.driver.AppleBluetoothMultitouch.trackpad"]
# Disable the five-finger pinch gesture on an Apple Bluetooth trackpad.
"TrackpadFiveFingerPinchGesture" = 0
# Disable the four-finger pinch gesture on an Apple Bluetooth trackpad.
"TrackpadFourFingerPinchGesture" = 0
# Disable the four-finger vertical swipe gesture on an Apple Bluetooth trackpad.
"TrackpadFourFingerVertSwipeGesture" = 0
# Disable the three-finger vertical swipe gesture on an Apple Bluetooth trackpad.
"TrackpadThreeFingerVertSwipeGesture" = 0
# Disable the two-finger swipe from the right edge on an Apple Bluetooth trackpad.
"TrackpadTwoFingerFromRightEdgeSwipeGesture" = 0

[tasks."macos-defaults:record"]
description = "Record one interactive macOS defaults change"
shell = "bash -c"
run = 'cd "{{ env.HOME }}/.dotfiles/vendor/macos-defaults" && bash ./diff.sh'

[tasks."macos-defaults:status"]
description = "Show managed macOS defaults drift; fail when reconciliation is needed"
shell = "bash -c"
run = 'mise -C "{{ env.HOME }}/.dotfiles/mise" bootstrap macos defaults status --missing'

[tasks."macos-defaults:unsupported:check"]
description = "Verify reviewed host-scoped and complex macOS defaults"
shell = "bash -c"
run = '"{{ env.HOME }}/.dotfiles/bin/macos-defaults-audit" verify --manifest "{{ env.HOME }}/.dotfiles/mise-dots/macos/unsupported-defaults.json"'

[tasks."betterdisplay:check"]
description = "Check BetterDisplay sync profile against dotfiles"
shell = "bash -c"
run = '"{{ env.HOME }}/.dotfiles/bin/betterdisplay-prefs" check'

[tasks."betterdisplay:export"]
description = "Export BetterDisplay sync profile to dotfiles"
shell = "bash -c"
run = '"{{ env.HOME }}/.dotfiles/bin/betterdisplay-prefs" export'

[tasks."betterdisplay:import"]
description = "Import BetterDisplay sync profile from dotfiles"
confirm = { message = "Apply the dotfiles BetterDisplay sync profile?", default = "no" }
shell = "bash -c"
run = '"{{ env.HOME }}/.dotfiles/bin/betterdisplay-prefs" import'

[dotfiles]
"~/.config/borders/bordersrc" = "~/.dotfiles/mise-dots/macos/bordersrc"
"~/.config/linearmouse/linearmouse.json" = "~/.dotfiles/mise-dots/macos/linearmouse.json"
"~/.homebrew/Brewfile" = "~/.dotfiles/Brewfile"
"~/.local/bin/fix-tahoe-focus" = "~/.dotfiles/mise-dots/macos/xdg-bin/fix-tahoe-focus"
"~/.local/bin/restart-soundsource" = "~/.dotfiles/mise-dots/macos/xdg-bin/restart-soundsource"
"~/.local/bin/try" = "~/.dotfiles/mise-dots/macos/xdg-bin/try-darwin-aarch64"
"~/Library/Application Support/Sublime Text 3/Packages/User" = "~/.dotfiles/mise-dots/config/sublime-text/Packages/User"
"~/Library/Application Support/Rectangle Pro/RectangleProConfig.json" = {
    source = "~/.dotfiles/mise-dots/macos/RectangleProConfig.json",
    mode = "copy",
}
"~/Library/Application Support/Tuna/config.toml" = "~/.dotfiles/mise-dots/macos/tuna.toml"
